<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Iglesia</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="LOGO.png">
    <!-- ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
</head>
<body>
    <div class="container">
        <!-- LADO IZQUIERDO -->
        <div class="left-section">
            <div class="logo-circle">
                <i class="fa-solid fa-church"></i>
            </div>
            <h2>SISTEMA DE GESTIÓN</h2>
            <h1>IGLESIA</h1>
            <div class="line"></div>
            <p>
                Administra miembros, asistencia <br>
                y actividades de tu iglesia de manera eficiente.
            </p>
        </div>
        <!-- FORMULARIO -->
        <div class="login-box">
            <div class="lock-icon">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2>Iniciar Sesión</h2>
            <p>Accede al sistema de gestión <br> de tu iglesia</p>
            <form>
                <label>Usuario</label>
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="Ingresa tu usuario">
                </div>
                <label>Contraseña</label>
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="Ingresa tu contraseña">
                    <i class="fa-solid fa-eye-slash eye"></i>
                </div>
                <div class="options">
                    <div class="remember">
                        <input type="checkbox" checked>
                        <span>Recordar sesión</span>
                    </div>
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
                <button type="submit">INICIAR SESIÓN</button>
            </form>
        </div>
    </div>
    <footer>
        © 2026 Sistema de Gestión Iglesia. Todos los derechos reservados.
    </footer>
</body>
</html>
